<nav class="navbar" aria-label="Glowne menu">
  <a class="navbar-brand" routerLink="/">GieudexPol</a>

  <div class="navbar-links">
    @for (item of navItems; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        {{ item.label }}
      </a>
    }
  </div>

  <div class="account">
    <span class="email">{{ userEmail }}</span>
    <button type="button" class="logout" (click)="logout()">Wyloguj</button>
  </div>
</nav>
