<nav class="navbar" aria-label="Glowne menu">
  <a class="navbar-brand" routerLink="/">GieudexPol</a>

  <div class="navbar-links">
    @for (item of navItems; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        {{ item.label }}
        @if (
          item.path === '/alerts' &&
          userAlertService.hasFulfilledAlerts()
        ) {
          <span class="alert-dot" aria-label="Spełniony alert"></span>
        }
      </a>
    }
    @if (isAdmin) {
      <a
        class="nav-link"
        routerLink="/admin/users"
        routerLinkActive="active-link"
      >
        Panel administratora
      </a>
    }
  </div>

  <div class="account">
    <span class="email">{{ userEmail }}</span>
    <button type="button" class="logout" (click)="logout()">Wyloguj</button>
  </div>
</nav>
